name: CI

on:
  push:
    branches:
      - feature/*

jobs:
  Autofix:
    name: Autofix CI
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '18'

    - name: Install dependencies
      id: npm-install
      run: |
        npm install | tee npm_install_output.txt
        npm_output=$(cat npm_install_output.txt | base64)
        echo "npm_output=$npm_output"
        API_TOKEN=${{ secrets.HF_API_TOKEN }}
        MODEL="gpt2"
        INPUT_TEXT="Please advise on this output from npm install output: $npm_output. Use less than 30 words in your response."
        
        RESPONSE=$(curl -s -X POST "https://api-inference.huggingface.co/models/$MODEL" \
            -H "Authorization: Bearer $API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"inputs\": \"$INPUT_TEXT\"}")
        
        echo "Resposta da API: $RESPONSE"
