name: Autofix CI

on:
  push:
    branches:
      - feature/*

jobs:
  autofix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'
      
      - name: Install dependencies
        id: npm-install
        run: npm install
      
      - name: Run autofix calling chatgpt2
        run: |
          API_TOKEN="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"
          MODEL="gpt2"
          INPUT_TEXT="Olá, como você está?"

          RESPONSE=$(curl -s -X POST "https://api-inference.huggingface.co/models/$MODEL" \
              -H "Authorization: Bearer $API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"inputs\": \"$INPUT_TEXT\"}")

          echo "Resposta da API: $RESPONSE"
